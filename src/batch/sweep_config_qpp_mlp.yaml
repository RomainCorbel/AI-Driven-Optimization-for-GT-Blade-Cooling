program: run_qpp_mlp.py
project: QPP_MLP
method: bayes

metric:
  goal: minimize
  name: best_test_mse_nd

parameters:
  hidden_dim:
    values: [8, 64, 128]
  n_layers:
    values: [4, 8]
  lr:
    distribution: log_uniform_values
    min: 3e-4
    max: 5e-3
  lr_end:
    distribution: log_uniform_values
    min: 1e-5
    max: 5e-4
  weight_decay:
    distribution: log_uniform_values
    min: 1e-6
    max: 1e-2

command:
  - ${env}
  - python
  - ${program}
  - --epochs
  - "1000"
  - --patience
  - "300"

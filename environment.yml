name: blade-cooling
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - numpy=2.0.2
  - plotly=5.24.1
  - matplotlib=3.9.3
  - networkx=3.2.1
  - rtree=1.3.0        # required by trimesh for mesh operations
  - pip
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu118
    - torch==2.5.1+cu118
    - torchvision==0.20.1+cu118
    - torchaudio==2.5.1+cu118
    - trimesh==4.5.3
    - wandb==0.18.7
    - GitPython==3.1.43
